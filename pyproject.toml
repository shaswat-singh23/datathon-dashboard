[project]
name = "royale"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=2.0.0",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
