[project]
name = "datathon"
version = "0.1.0"
description = "Datathon team repo"
requires-python = ">=3.11,<3.14"
dependencies = [
    "duckdb",
    "lightgbm",
    "matplotlib",
    "numpy",
    "openpyxl",
    "pandas",
    "plotly",
    "polars",
    "pyarrow",
    "requests",
    "scikit-learn",
    "statsmodels",
    "streamlit",
    "tabulate",
]

[dependency-groups]
dev = [
    "ipykernel",
    "jupyterlab",
    "ruff",
    "seaborn",
    "shap",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]
